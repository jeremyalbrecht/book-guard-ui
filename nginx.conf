server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Hashed build assets are safe to cache forever.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Runtime config and the service worker must always be revalidated — see
	# src/lib/config.ts and src/service-worker.ts for why.
	location = /config.json {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location = /service-worker.js {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# SPA fallback: every unmatched route resolves to the app shell (see the
	# adapter-static `fallback: 'index.html'` comment in vite.config.ts).
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
